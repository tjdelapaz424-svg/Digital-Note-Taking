<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Dashboard | Notebook</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="brand-icon"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="6" width="40" height="52" rx="7" fill="#F2A6C4"/><rect x="8" y="6" width="8" height="52" rx="4" fill="#E37FA6"/><line x1="24" y1="20" x2="42" y2="20" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="24" y1="29" x2="42" y2="29" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/><line x1="24" y1="38" x2="36" y2="38" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/><rect x="38" y="2" width="9" height="30" rx="4.5" transform="rotate(40 42.5 17)" fill="#33234A" stroke="#fff" stroke-width="1.2"/></svg><span class="brand" style="font-size:20px;">Notebook</span></div>
    <div class="who" id="whoLabel">Student</div>
    <nav>
      <a class="active" id="navClasses"><span class="label">My Classes</span></a>
      <a id="navHistory" href="history.html"><span class="label">History</span></a>
      <a href="flashcards.html"><span class="label">Flashcards</span></a>
      <a href="challenges.html"><span class="label">Challenges</span></a>
    </nav>
    <button class="navlink logout btn-outline" id="logoutBtn" style="color:#fff;border-color:rgba(255,255,255,.4);">Log out</button>
  </div>

  <div class="main">
    <div class="topbar-actions">
      <div>
        <div class="page-title">Your classes</div>
        <div class="page-sub">Join a class with a code from your teacher.</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="bell-btn" id="bellBtn" title="Notifications">
          🔔<span class="bell-badge hidden" id="bellBadge">0</span>
        </button>
        <button class="btn-primary" id="joinClassBtn">+ Add class using code</button>
      </div>
    </div>
    <div id="notifPanel" class="notif-panel hidden"></div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-num" id="statStreak">0 🔥</div><div class="stat-label">Day streak</div></div>
      <div class="stat-card"><div class="stat-num" id="statLongestStreak">0</div><div class="stat-label">Longest streak</div></div>
      <div class="stat-card"><div class="stat-num" id="statQuizzes">0</div><div class="stat-label">Quizzes completed</div></div>
      <div class="stat-card"><div class="stat-num" id="statFlashSessions">0</div><div class="stat-label">Flashcard sessions</div></div>
    </div>

    <div id="classGrid" class="grid-cards"></div>
    <div id="classEmpty" class="empty-state hidden">You haven't joined any classes yet.</div>
  </div>
</div>

<div class="modal-backdrop hidden" id="joinModal">
  <div class="modal">
    <h3>Join a class</h3>
    <p style="font-size:13px;color:#7A8A81;margin-top:0;">Ask your teacher for the class code.</p>
    <div id="joinError" class="error-msg hidden"></div>
    <div class="field">
      <label>Class code</label>
      <input type="text" id="joinCodeInput" style="text-transform:uppercase;letter-spacing:2px;" maxlength="8" placeholder="e.g. K7Q2XZ" />
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn-outline" id="cancelJoinBtn">Cancel</button>
      <button class="btn-primary" id="submitJoinBtn">Request to join</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/student.js"></script>
<div class="credit-footer">Created by TJ Dela Paz</div>
</body>
</html>

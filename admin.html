<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard | Notebook</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="brand-icon"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="6" width="40" height="52" rx="7" fill="#F2A6C4"/><rect x="8" y="6" width="8" height="52" rx="4" fill="#E37FA6"/><line x1="24" y1="20" x2="42" y2="20" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="24" y1="29" x2="42" y2="29" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/><line x1="24" y1="38" x2="36" y2="38" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/><rect x="38" y="2" width="9" height="30" rx="4.5" transform="rotate(40 42.5 17)" fill="#33234A" stroke="#fff" stroke-width="1.2"/></svg><span class="brand" style="font-size:20px;">Notebook</span></div>
    <div class="who">Admin</div>
    <nav>
      <button class="navlink active" id="tabTeachers"><span class="label">Teachers</span></button>
      <button class="navlink" id="tabStudents"><span class="label">Students</span></button>
    </nav>
    <button class="navlink logout btn-outline" id="logoutBtn" style="color:#fff;border-color:rgba(255,255,255,.4);">Log out</button>
  </div>

  <div class="main">
    <div class="page-title" id="panelTitle">Teacher accounts</div>
    <div class="page-sub">All registered accounts, straight from the database.</div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Username</th><th>Password</th><th>Age</th><th>Sex</th><th>Region</th>
          </tr>
        </thead>
        <tbody id="accountsBody"></tbody>
      </table>
      <div id="accountsEmpty" class="empty-state hidden">No accounts yet.</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<div class="credit-footer">Created by TJ Dela Paz</div>
</body>
</html>

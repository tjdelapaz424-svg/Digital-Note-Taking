<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>History | Notebook</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="brand-icon"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="6" width="40" height="52" rx="7" fill="#F2A6C4"/><rect x="8" y="6" width="8" height="52" rx="4" fill="#E37FA6"/><line x1="24" y1="20" x2="42" y2="20" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="24" y1="29" x2="42" y2="29" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/><line x1="24" y1="38" x2="36" y2="38" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/><rect x="38" y="2" width="9" height="30" rx="4.5" transform="rotate(40 42.5 17)" fill="#33234A" stroke="#fff" stroke-width="1.2"/></svg><span class="brand" style="font-size:20px;">Notebook</span></div>
    <div class="who" id="whoLabel">Student</div>
    <nav>
      <a href="student.html"><span class="label">My Classes</span></a>
      <a class="active"><span class="label">History</span></a>
    </nav>
    <button class="navlink logout btn-outline" id="logoutBtn" style="color:#fff;border-color:rgba(255,255,255,.4);">Log out</button>
  </div>

  <div class="main">
    <div class="topbar-actions">
      <div>
        <div class="page-title">Submission history</div>
        <div class="page-sub">Every notebook you've submitted, across all your classes.</div>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr><th>Class</th><th>Submitted</th><th>Status</th><th>Feedback</th><th></th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
      <div id="historyEmpty" class="empty-state hidden">You haven't submitted any notebooks yet.</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/history.js"></script>
<div class="credit-footer">Created by TJ Dela Paz</div>
</body>
</html>
